name: Publish to NPM

on:
  release:
    types: [published] 

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write 
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Upgrade NPM
        run: npm install -g npm@latest

      - name: Install dependencies and build
        run: |
          npm install
          npm run build

      - name: Publish to NPM
        run: npm publish --provenance --access public
